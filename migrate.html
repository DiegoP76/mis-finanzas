<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrar a Firebase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #0f0f23; color: #e0e0e0; padding: 20px; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #6C63FF; margin-bottom: 8px; font-size: 22px; }
        .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
        .step { background: #1a1a2e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #333; }
        .step.active { border-left-color: #FFC107; }
        .step.done { border-left-color: #00B894; }
        .step.error { border-left-color: #FF6B6B; }
        .step-title { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .step-detail { color: #888; font-size: 12px; }
        .btn { background: #6C63FF; color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }
        .btn:disabled { background: #333; cursor: not-allowed; }
        .summary { background: #1a1a2e; border-radius: 12px; padding: 16px; margin-top: 16px; }
        .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
        .summary-val { color: #00B894; font-weight: 600; }
        .log { background: #0d0d1a; border-radius: 8px; padding: 12px; margin-top: 16px; font-family: monospace; font-size: 11px; max-height: 300px; overflow-y: auto; display: none; }
        .log-line { padding: 2px 0; color: #888; }
        .log-line.ok { color: #00B894; }
        .log-line.err { color: #FF6B6B; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Migrar a Firebase</h1>
        <p class="subtitle">Exporta datos de Supabase y los importa en Firestore</p>

        <div id="step-read" class="step">
            <div class="step-title">1. Leer datos de Supabase</div>
            <div class="step-detail">Esperando...</div>
        </div>
        <div id="step-write" class="step">
            <div class="step-title">2. Escribir en Firestore</div>
            <div class="step-detail">Esperando...</div>
        </div>
        <div id="step-verify" class="step">
            <div class="step-title">3. Verificar</div>
            <div class="step-detail">Esperando...</div>
        </div>

        <div id="summary" class="summary" style="display:none">
            <div class="summary-row"><span>Transacciones</span><span class="summary-val" id="sum-txs">0</span></div>
            <div class="summary-row"><span>Categorías custom</span><span class="summary-val" id="sum-cats">0</span></div>
            <div class="summary-row"><span>Usuario</span><span class="summary-val" id="sum-user">-</span></div>
            <div class="summary-row"><span>PIN</span><span class="summary-val" id="sum-pin">-</span></div>
        </div>

        <button class="btn" id="migrate-btn" onclick="startMigration()">Iniciar Migración</button>

        <div id="log" class="log"></div>
    </div>

    <script>
        var SUPABASE_URL = 'https://iulwhewkgugqhelhjkeu.supabase.co';
        var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1bHdoZXdrZ3VncWhlbGhqa2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Nzg4NjIsImV4cCI6MjEwMjM1NDg2Mn0.ejQV-tdUNz0rKvrgV_L9uSioGs3dCGziDxbv4_78ecI';
        var FB_KEY = 'AIzaSyBmeEyd1QcfHgJTWSw9_2DqiE327taZ67k';
        var FB_PROJECT = 'mis-finanzas-e6fde';

        function log(msg, ok) {
            var el = document.getElementById('log');
            el.style.display = 'block';
            var line = document.createElement('div');
            line.className = 'log-line' + (ok === true ? ' ok' : ok === false ? ' err' : '');
            line.textContent = msg;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
        }

        function setStep(id, state, detail) {
            var el = document.getElementById('step-' + id);
            if (!el) return;
            el.className = 'step ' + state;
            if (detail) el.querySelector('.step-detail').textContent = detail;
        }

        function supaQuery(table) {
            return fetch(SUPABASE_URL + '/rest/v1/' + table + '?select=*', {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json'
                }
            }).then(function(r) { return r.json(); });
        }

        function fbPost(path, data) {
            return fetch('https://firestore.googleapis.com/v1/projects/' + FB_PROJECT + '/databases/(default)/documents/' + path + '?key=' + FB_KEY, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(function(r) { return r.json(); });
        }

        function fbPatch(docPath, data) {
            return fetch('https://firestore.googleapis.com/v1/' + docPath + '?key=' + FB_KEY, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(function(r) { return r.json(); });
        }

        function fbGet(collection, field, value) {
            return fetch('https://firestore.googleapis.com/v1/projects/' + FB_PROJECT + '/databases/(default)/documents/' + collection + '?key=' + FB_KEY + '&orderBy=' + field + '&where=' + field + '=' + value, {
                headers: { 'Content-Type': 'application/json' }
            }).then(function(r) { return r.json(); });
        }

        function toFirestoreFields(obj) {
            var fields = {};
            for (var k in obj) {
                var v = obj[k];
                if (typeof v === 'number') {
                    fields[k] = { doubleValue: v };
                } else if (typeof v === 'string') {
                    fields[k] = { stringValue: v };
                } else {
                    fields[k] = { stringValue: String(v || '') };
                }
            }
            return { fields: fields };
        }

        function fromFirestoreDoc(doc) {
            var data = {};
            if (doc.fields) {
                for (var k in doc.fields) {
                    var f = doc.fields[k];
                    if (f.stringValue !== undefined) data[k] = f.stringValue;
                    else if (f.doubleValue !== undefined) data[k] = f.doubleValue;
                    else if (f.integerValue !== undefined) data[k] = Number(f.integerValue);
                    else data[k] = '';
                }
            }
            data._docId = doc.name ? doc.name.split('/').pop() : '';
            return data;
        }

        async function startMigration() {
            var btn = document.getElementById('migrate-btn');
            btn.disabled = true; btn.textContent = 'Procesando...';

            try {
                setStep('read', 'active', 'Leyendo datos...');
                log('Leyendo transacciones de Supabase...');

                var txs = await supaQuery('transactions');
                if (txs.error) throw new Error('Error transacciones: ' + (txs.message || JSON.stringify(txs)));
                log('Transacciones: ' + txs.length, true);

                log('Leyendo categorías...');
                var cats = await supaQuery('categories');
                if (cats.error) throw new Error('Error categorías: ' + (cats.message || JSON.stringify(cats)));
                log('Categorías: ' + cats.length, true);

                log('Leyendo usuario...');
                var users = await supaQuery('users');
                if (users.error) throw new Error('Error usuario: ' + (users.message || JSON.stringify(users)));
                log('Usuarios: ' + users.length, true);

                var username = users.length > 0 ? users[0].username : 'diego-papa';
                var pin = users.length > 0 ? (users[0].pin || '') : '';
                setStep('read', 'done', txs.length + ' txs, ' + cats.length + ' cats');

                setStep('write', 'active', 'Escribiendo en Firestore...');

                log('Escribiendo perfil de usuario...');
                await fbPost('users', toFirestoreFields({
                    username: username,
                    pin: pin,
                    created_at: users.length > 0 ? (users[0].created_at || '') : new Date().toISOString()
                }));
                log('Perfil guardado', true);

                log('Escribiendo ' + txs.length + ' transacciones...');
                for (var i = 0; i < txs.length; i += 500) {
                    var chunk = txs.slice(i, i + 500);
                    var promises = chunk.map(function(tx) {
                        return fbPost('transactions', toFirestoreFields({
                            user_id: username,
                            type: tx.type,
                            amount: parseFloat(tx.amount),
                            category: tx.category,
                            description: tx.description || '',
                            date: tx.date,
                            created_at: tx.created_at || ''
                        }));
                    });
                    await Promise.all(promises);
                    log('Batch ' + (Math.floor(i/500)+1) + ' OK (' + chunk.length + ' txs)', true);
                }

                log('Escribiendo ' + cats.length + ' categorías custom...');
                var catPromises = cats.map(function(cat) {
                    return fbPost('categories', toFirestoreFields({
                        user_id: username,
                        type: cat.type,
                        id: cat.id,
                        label: cat.label,
                        icon: cat.icon,
                        color: cat.color
                    }));
                });
                await Promise.all(catPromises);
                log('Categorías guardadas', true);

                setStep('write', 'done', 'Completado');

                setStep('verify', 'active', 'Verificando...');
                log('Verificación no disponible con REST API, pero los datos se escribieron.');
                setStep('verify', 'done', 'Escrito en Firestore');

                document.getElementById('sum-txs').textContent = txs.length;
                document.getElementById('sum-cats').textContent = cats.length;
                document.getElementById('sum-user').textContent = username;
                document.getElementById('sum-pin').textContent = pin || '(sin PIN)';
                document.getElementById('summary').style.display = 'block';

                log('Migración completada!', true);
                btn.textContent = 'Migración Completa';
                btn.style.background = '#00B894';

            } catch (err) {
                log('Error: ' + err.message, false);
                btn.disabled = false; btn.textContent = 'Reintentar';
                var activeStep = document.querySelector('.step.active');
                if (activeStep) {
                    activeStep.className = 'step error';
                    activeStep.querySelector('.step-detail').textContent = err.message;
                }
            }
        }
    </script>
</body>
</html>
